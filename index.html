    <meta name="theme-color" content="#1e1e2e">

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preload" href="assets/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">

    <link rel="stylesheet" href="css/common.css?v=__BUILD__">
    <link rel="stylesheet" href="css/style.css?v=__BUILD__">
    <link rel="stylesheet" href="css/retro.css?v=__BUILD__">

    <script src="js/layout.js?v=__BUILD__"></script>
    <script>document.documentElement.dataset.theme = loadPref("theme", ["dark", "light"], "dark"); document.documentElement.dataset.style = loadStyle();</script>
</head>
<body>
    <div class="preloader visually-hidden" aria-hidden="true">x</div>

    <header class="statusbar">
        <span class="session">[0] gabriel</span>
        <span class="window"><span class="idx">1:</span><span id="window-path">~</span>*</span>
        <div class="controls">
            <a class="bar-btn" href="landing.html" data-cmd="gui">&gt;_ gui</a>
            <button id="lang-btn" aria-label="Change language">PT</button>
            <button id="theme-btn" aria-label="Change theme">◐</button>
            <button id="style-btn" aria-label="Toggle retro look" title="retro"><svg class="icon-tv" viewBox="0 0 14 14" aria-hidden="true"><path d="M4.5 1.5 7 4 9.5 1.5M1.5 4.5h11v7h-11zM3.5 6.5h5v3h-5zM10.5 7v0M10.5 9v0M3.5 11.5v1.5M10.5 11.5v1.5"/></svg></button>
        </div>
    </header>

    <div id="terminal" role="log" aria-live="polite" aria-label="Interactive terminal"></div>

    <div id="mobile-toolbar">
        <div class="toolbar-chips" role="group" aria-label="Command shortcuts">
            <button class="chip" data-cmd="ls">ls</button>
            <button class="chip" data-cmd="cd" data-arg="1">cd</button>
            <button class="chip" data-cmd="cd ..">cd ..</button>
            <button class="chip" data-cmd="cat" data-arg="1">cat</button>
            <button class="chip" data-cmd="help">help</button>
            <button class="chip" data-cmd="clear">clear</button>
            <button class="chip" data-cmd="lang" data-arg="1">lang</button>
            <button class="chip" data-cmd="theme" data-arg="1">theme</button>
        </div>
        <div class="toolbar-input">
            <span class="toolbar-prompt" aria-hidden="true">$</span>
            <label class="visually-hidden" for="mobile-input">Terminal command</label>
            <input type="text" id="mobile-input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="type command...">
            <button id="mobile-send" aria-label="Run command">⏎</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal@2.x/js/jquery.terminal.min.js"></script>
    <script src="js/filesystem.js?v=__BUILD__"></script>
    <script src="js/commands.js?v=__BUILD__"></script>
    <script src="js/main.js?v=__BUILD__"></script>
</body>
</html>
